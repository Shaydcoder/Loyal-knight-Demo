<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-title">Secure Notes</div>
    <button id="add-note-btn" class="btn primary-btn">+ Add Note</button>
  </header>

  <main class="main-content">
    <div id="notification-area" class="notification hidden"></div>
    <div id="empty-state" class="empty-state hidden">
      No notes yet. Click + Add Note to create one.
    </div>
    <div id="notes-grid" class="notes-grid"></div>
  </main>

  <div id="note-modal" class="modal hidden">
    <div class="modal-content">
      <h2>New Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-title">Title</label>
          <input type="text" id="note-title" required>
        </div>
        <div class="form-group">
          <label for="note-content">Content</label>
          <textarea id="note-content" required></textarea>
        </div>
        <div class="form-group">
          <label for="note-author">Author</label>
          <input type="text" id="note-author" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-note-btn" class="btn text-btn">Cancel</button>
          <button type="submit" class="btn primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
